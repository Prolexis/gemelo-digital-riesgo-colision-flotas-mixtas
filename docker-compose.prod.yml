services:
  db:
    image: postgres:16-alpine
    container_name: twin_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-twin_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twin_user} -d ${POSTGRES_DB:-twin_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - twin_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twin_backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-twin_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-twin_db}
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - twin_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: twin_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - twin_network

volumes:
  postgres_data:

networks:
  twin_network:
    driver: bridge
