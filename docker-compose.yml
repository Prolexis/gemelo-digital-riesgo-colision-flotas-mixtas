services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: twin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twin_pass}
      POSTGRES_DB: ${POSTGRES_DB:-twin_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twin_user} -d ${POSTGRES_DB:-twin_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - twin_network

  redis:
    image: redis:alpine
    container_name: twin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - twin_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twin_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-twin_user}:${POSTGRES_PASSWORD:-twin_pass}@db:5432/${POSTGRES_DB:-twin_db}
      REDIS_URL: redis://redis:6379/0
      ENV: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - twin_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: twin_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - twin_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: twin_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - twin_network

volumes:
  postgres_data:

networks:
  twin_network:
    driver: bridge
